const BS_MONTHS=['Baisakh','Jestha','Ashadh','Shrawan','Bhadra','Ashwin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
const START_YEAR=2078, END_YEAR=3000;

function money(n){return 'NPR '+Math.round(Number(n)||0).toLocaleString('en-IN')}
function rateMoney(n){const v=Number(n)||0;return 'NPR '+v.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function keyOf(y,m){return Number(y)*12+Number(m)}
function monthLabel(y,m){return BS_MONTHS[m]+' '+y}
function previousMonthLabel(y,m){const yy=Number(y)+(Number(m)<=0?-1:0);const mm=(Number(m)+11)%12;return monthLabel(yy,mm)}
function parseMonth(v){const [y,m]=String(v).split('-').map(Number);return {y,m}}
function monthOptions(selectedYear,selectedMonth){return BS_MONTHS.map((x,i)=>`<option value="${i}" ${i===Number(selectedMonth)?'selected':''}>${x} ${selectedYear}</option>`).join('')}
function yearOptions(selected){let h='';for(let y=START_YEAR;y<=END_YEAR;y++)h+=`<option value="${y}" ${y===Number(selected)?'selected':''}>${y}</option>`;return h}
function dateLabel(v){if(!v)return '—';const [y,m,d]=String(v).split('-').map(Number);return `${d} ${BS_MONTHS[m-1]} ${y}`}
function monthKey(r){return keyOf(r.year,r.month)}
function sortRecords(c){c.records.sort((a,b)=>monthKey(b)-monthKey(a))}

      db.consumers.forEach(c=>{c.records=Array.isArray(c.records)?c.records:[];c.startingReading=Number(c.startingReading??1000);normalizeRecords(c)});

function current(c){if(!c.records.length)return null;sortRecords(c);return c.records[0]}
function migrateDefaultRate(){
  // The default rate was removed. Convert it once into month-specific rates so existing bills do not change.
  if(db.rateMigrated)return;
  if(Number(db.rate)>0||Number(db.fixed)>0){
    db.consumers.forEach(c=>c.records.forEach(r=>{
      const k=keyOf(r.year,r.month);
      if(!db.rates[k])db.rates[k]={year:Number(r.year),month:Number(r.month),rate:Number(db.rate)||0,fixed:Number(db.fixed)||0};
    }));
  }
  db.rate=0;db.fixed=0;db.rateMigrated=true;
}
function missingRateMonths(){
  const seen={};
  db.consumers.forEach(c=>c.records.forEach(r=>{const k=keyOf(r.year,r.month);if(!(db.rates&&db.rates[k]))seen[k]={year:Number(r.year),month:Number(r.month)}}));
  return Object.keys(seen).map(k=>({k,...seen[k]})).sort((a,b)=>keyOf(b.year,b.month)-keyOf(a.year,a.month));
}
function ratesFor(y,m){
  const o=db.rates&&db.rates[keyOf(y,m)];
  return o?{rate:Number(o.rate)||0,fixed:Number(o.fixed)||0}:{rate:Number(db.rate)||0,fixed:Number(db.fixed)||0,missing:!(Number(db.rate)>0)};
}
function calcBill(units,y,m){
  const rt=(y===undefined||m===undefined)?{rate:Number(db.rate)||0,fixed:Number(db.fixed)||0}:ratesFor(y,m);
  return Math.max(0,Number(units)||0)*rt.rate+rt.fixed;
}
function normalizeRecords(c){
 sortRecords(c);
 // Consumer view holds stored, already-computed values; only the admin recalculates.
 if(session?.type==='consumer')return;
 // Keep the meter-reading chain correct from oldest -> newest.
 for(let i=c.records.length-1;i>=0;i--){
   const r=c.records[i];
   if(i===c.records.length-1){
     r.prevReading=Number(r.prevReading??c.startingReading);
     r.prevMonth=r.prevMonth && !String(r.prevMonth).startsWith('undefined') ? r.prevMonth : previousMonthLabel(r.year,r.month);
   } else {
     r.prevReading=Number(c.records[i+1].currentReading);
     r.prevMonth=monthLabel(c.records[i+1].year,c.records[i+1].month);
   }
   r.currentMonth=monthLabel(r.year,r.month);
   r.units=Math.max(0,Number(r.currentReading)-Number(r.prevReading));
   const rt=ratesFor(r.year,r.month);r.rate=rt.rate;r.fixedCharge=rt.fixed;r.rateMissing=!!rt.missing;
   r.bill=calcBill(r.units,r.year,r.month);
   r.amountPaid=Math.max(0,Number(r.amountPaid)||0);
 }
 // Apply each month's own allocated payment plus any advance carried from the previous month.
 let carry=0;
 for(let i=c.records.length-1;i>=0;i--){
   const r=c.records[i], paid=r.amountPaid;
   const available=carry+paid;
   r.advanceUsed=Math.min(carry,r.bill);
   r.remaining=Math.max(0,r.bill-available);
   r.advanceCreated=Math.max(0,available-r.bill);
   carry=r.advanceCreated;
   r.status=r.remaining<=0?'Paid':'Due';
 }
 save();
}

const MEDIA_SQL=`create table if not exists public.colony_media (
  id text primary key,
  kind text not null,
  owner_id text,
  data_url text not null,
  created_at timestamptz not null default now()
);
alter table public.colony_media enable row level security;
drop policy if exists "admin manages media" on public.colony_media;
create policy "admin manages media" on public.colony_media
  for all to authenticated
  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.role = 'admin'))
  with check (exists (select 1 from public.profiles p where p.id = auth.uid() and p.role = 'admin'));

let mediaStatus='unknown', mediaErrorMsg='', noteDraft=null;
const photoCache={}, photoMissing={};
function isMissingTable(e){return !!e&&(e.code==='42P01'||e.code==='PGRST205'||/colony_media|schema cache|does not exist/i.test(e.message||''))}
async function mediaCheck(){
  if(!supabaseClient){mediaStatus='error';mediaErrorMsg='Cloud connection is unavailable.';return false}
  const {error}=await supabaseClient.from('colony_media').select('id').limit(1);
  if(!error){mediaStatus='ready';return true}
  mediaStatus=isMissingTable(error)?'missing':'error';mediaErrorMsg=error.message||String(error);return false;
}
async function mediaPut(id,kind,owner,dataUrl){
  if(!supabaseClient)throw new Error('Cloud connection is unavailable.');
  const {error}=await supabaseClient.from('colony_media').upsert({id,kind,owner_id:owner,data_url:dataUrl});
  if(error){
    if(isMissingTable(error)){mediaStatus='missing';throw new Error('Photo storage is not set up yet. Open the Notes tab and follow the one-time setup steps.')}
    throw error;
  }
  photoCache[id]=dataUrl;delete photoMissing[id];
}
async function mediaDelete(ids){
  ids=(ids||[]).filter(Boolean);
  if(!ids.length||!supabaseClient)return;
  const {error}=await supabaseClient.from('colony_media').delete().in('id',ids);
  if(error){console.error(error);return}
  ids.forEach(id=>{delete photoCache[id]});
}
function applyPhotos(){
  document.querySelectorAll('[data-photo]').forEach(n=>{

async function hydratePhotos(){
  if(session?.type!=='admin'||!supabaseClient)return;
  applyPhotos();
  const nodes=[...document.querySelectorAll('[data-photo]')];
  const need=[...new Set(nodes.map(n=>n.dataset.photo))].filter(id=>!photoCache[id]&&!photoMissing[id]);
  for(let i=0;i<need.length;i+=10){
    const chunk=need.slice(i,i+10);
    const {data,error}=await supabaseClient.from('colony_media').select('id,data_url').in('id',chunk);
    if(error){if(isMissingTable(error))mediaStatus='missing';return}
    const got={};
    (data||[]).forEach(r=>{photoCache[r.id]=r.data_url;got[r.id]=1});
    chunk.forEach(id=>{if(!got[id])photoMissing[id]=true});
    applyPhotos();
  }
}

function resizeImage(file,max,quality,square){
  return new Promise((resolve,reject)=>{
    if(!file)return reject(new Error('No image chosen.'));
    if(file.type&&!/^image\//.test(file.type))return reject(new Error('Please choose an image file.'));
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        let sx=0,sy=0,sw=img.width,sh=img.height;
        if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
        const k=Math.min(1,max/Math.max(sw,sh)),w=Math.max(1,Math.round(sw*k)),h=Math.max(1,Math.round(sh*k));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,sx,sy,sw,sh,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality));
      }catch(e){reject(e)}finally{URL.revokeObjectURL(url)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('This image could not be read. Try a JPG or PNG photo.'))};
    img.src=url;
  });
}

  db.consumers.push(x.consumer);
  if(x.deletedRecords.length)db.deletedRecords[id]=x.deletedRecords;
  db.deletedConsumers=arr.filter(d=>d.consumer.id!==id);
  normalizeRecords(x.consumer);save();adminTab='consumers';renderAdmin();
}
function permanentlyDeleteConsumer(id){
  const arr=db.deletedConsumers||[],x=arr.find(d=>d.consumer.id===id);if(!x)return;
  if(!confirm(`Permanently delete ${x.consumer.id} — ${x.consumer.name} and all their records?\n\nThis cannot be undone.`))return;
  db.deletedConsumers=arr.filter(d=>d.consumer.id!==id);
  mediaDelete(['consumer:'+id]);
  save();adminTab='deleted';renderAdmin();
}
function showAddConsumer(){shell(`<div class="card"><div class="row"><div><h2 class="title">Add consumer</h2><p class="sub">Create a private ID for a new household.</p></div><button class="btn secondary" onclick="renderAdmin()">Back</button></div><div class="field" style="margin-top:18px"><label>Consumer ID</label><input id="newId" placeholder="C004"></div><div class="field"><label>Name</label><input id="newName" placeholder="Consumer 4"></div><div class="field"><label>Meter ID</label><input id="newMeter" placeholder="M004"></div><div class="field"><label>Starting meter reading</label><input id="newStart" type="number" min="0" value="0"></div><div class="field"><label>Consumer password</label><input id="newPassword" type="password" placeholder="Minimum 6 characters"></div><div class="field"><label>Photo (optional)</label><input id="newPhoto" type="file" accept="image/*"></div><button class="btn" onclick="addConsumer()">Create consumer</button></div>`)}
async function addConsumer(){
  const id=$('newId').value.trim().toUpperCase(),
        name=$('newName').value.trim(),
        meter=$('newMeter').value.trim().toUpperCase(),
        start=Number($('newStart').value),
        password=$('newPassword').value,
        photoFile=($('newPhoto')&&$('newPhoto').files&&$('newPhoto').files[0])||null;
  if(!id||!name||!meter||!Number.isFinite(start)||!password)return alert('Fill all fields.');
  if(password.length<6)return alert('Consumer password must be at least 6 characters.');
  if(db.consumers.some(c=>c.id===id))return alert('Consumer ID already exists.');
  if((db.deletedConsumers||[]).some(x=>x.consumer.id===id))return alert('That ID is in Deleted records. Restore it there or delete it permanently first.');
  db.consumers.push({id,name,meter,startingReading:start,records:[]});
  try{
    await cloudSetConsumerPassword(id,password);
    if(photoFile){try{await setPhotoFile(id,photoFile)}catch(pe){alert('Consumer created, but the photo could not be saved: '+(pe.message||pe))}}
    save();
    renderAdmin();
  }catch(e){
    db.consumers=db.consumers.filter(c=>c.id!==id);
    alert('Could not create consumer password: '+(e.message||e));
  }
}
function updateReadingPreview(id){const c=db.consumers.find(x=>x.id===id);const cur=Number($('readCurrent').value);if(!Number.isFinite(cur)){ $('readPreview').innerHTML='';return}const y=Number($('readYear').value),m=Number($('readMonth').value),latest=current(c);let prev=latest?latest.currentReading:c.startingReading;if(latest&&keyOf(y,m)<monthKey(latest)){prev=0}$('readPreview').innerHTML=`<div class="preview"><div class="label">Estimated bill</div><strong>${money(calcBill(Math.max(0,cur-prev),y,m))}</strong><div class="small muted" style="margin-top:5px">${Math.max(0,cur-prev)} units • Previous reading ${prev}</div></div>`}
function paymentAllocationPreview(c,amount){
 const rows=[];let left=Math.max(0,Number(amount)||0);
 const asc=[...c.records].sort((a,b)=>monthKey(a)-monthKey(b));
 for(const r of asc){
   const due=Math.max(0,Number(r.remaining)||0);
   if(left<=0)break;
   const pay=Math.min(left,due);
   if(pay>0){rows.push(`${monthLabel(r.year,r.month)}: ${money(pay)}`);left-=pay;}
 }
 if(left>0 && asc.length)rows.push(`${monthLabel(asc[asc.length-1].year,asc[asc.length-1].month)}: ${money(left)} advance`);
 return {rows,left};
}
function updatePaymentPreview(id){const c=db.consumers.find(x=>x.id===id);if(!$('payAmount')||!$('payPreview'))return;const amount=Number($('payAmount').value)||0;const p=paymentAllocationPreview(c,amount);$('payPreview').innerHTML=p.rows.length?`<div class="preview"><div class="label">Payment will be applied oldest due month first</div>${p.rows.map(x=>`<div class="small" style="margin-top:5px">${esc(x)}</div>`).join('')}</div>`:`<div class="small muted">Enter an amount to see how it will be distributed.</div>`}
function showPayment(id){const c=db.consumers.find(x=>x.id===id);normalizeRecords(c);if(!c.records.length)return alert('Add a monthly reading first.');shell(`<div class="card"><div class="row"><div><h2 class="title">Record payment</h2><p class="sub">${esc(c.id)} — payment will cover the oldest due months first</p></div><button class="btn secondary" onclick="showAdminHistory('${id}')">Back</button></div><div class="notice">If older months are unpaid, this payment is automatically applied to those older dues first. Any remaining amount goes to the next due month, then becomes advance after all current dues are cleared.</div><div class="field"><label>Total amount received</label><input id="payAmount" type="number" min="0" step="0.01" value="0" oninput="updatePaymentPreview('${id}')"></div><div id="payPreview"></div><div class="field"><label>Payment method</label><select id="payMethod"><option>Cash</option><option>QR</option></select></div><div class="field"><label>Payment date (BS)</label>${bsDateControls('payDate','2083-06-01')}</div><button class="btn" onclick="savePayment('${id}')">Save payment</button></div>`);updatePaymentPreview(id)}
function savePayment(id){const c=db.consumers.find(x=>x.id===id);normalizeRecords(c);const amount=Number($('payAmount').value);if(!Number.isFinite(amount)||amount<=0)return alert('Enter a payment amount greater than 0.');const method=$('payMethod').value,date=bsValue('payDate');let left=amount;const asc=[...c.records].sort((a,b)=>monthKey(a)-monthKey(b));for(const r of asc){if(left<=0)break;const due=Math.max(0,Number(r.remaining)||0);if(due>0){const add=Math.min(left,due);r.amountPaid=(Number(r.amountPaid)||0)+add;r.paymentMethod=method;r.paymentDate=date;left-=add;}}
 if(left>0&&asc.length){const latest=asc[asc.length-1];latest.amountPaid=(Number(latest.amountPaid)||0)+left;latest.paymentMethod=method;latest.paymentDate=date;}
 normalizeRecords(c);showAdminHistory(id)}
function editHistory(id,uid){const c=db.consumers.find(x=>x.id===id),r=c.records.find(x=>x.uid===uid);shell(`<div class="card"><div class="row"><div><h2 class="title">Edit ${esc(monthLabel(r.year,r.month))}</h2><p class="sub">Previous reading is protected by the record chain.</p></div><button class="btn secondary" onclick="showAdminHistory('${id}')">Back</button></div><div class="field" style="margin-top:18px"><label>Billing year (BS)</label><select id="editYear" onchange="refreshEditMonth()">${yearOptions(r.year)}</select></div><div class="field"><label>Billing month</label><select id="editMonth" onchange="updateEditPreview('${id}','${uid}')">${monthOptions(r.year,r.month)}</select></div><div class="field"><label>Previous reading</label><input value="${r.prevReading}" disabled></div><div class="field"><label>Current reading</label><input id="editCurrent" type="number" min="0" value="${r.currentReading}" oninput="updateEditPreview('${id}','${uid}')"></div><div class="field"><label>Amount paid</label><input id="editPaid" type="number" min="0" value="${r.amountPaid||0}" oninput="updateEditPreview('${id}','${uid}')"></div><div class="field"><label>Payment method</label><select id="editMethod"><option ${r.paymentMethod==='Cash'?'selected':''}>Cash</option><option ${r.paymentMethod==='QR'?'selected':''}>QR</option></select></div><div class="field"><label>Payment date (BS)</label>${bsDateControls('editDate',r.paymentDate||'2083-06-01')}</div><div id="editPreview"></div><button class="btn" onclick="saveHistoryEdit('${id}','${uid}')">Save changes</button></div>`);updateEditPreview(id,uid)}
function refreshEditMonth(){const y=Number($('editYear').value),old=Number($('editMonth').value)||0;$('editMonth').innerHTML=monthOptions(y,old);updateEditPreview(selectedId||'', '')}
function updateEditPreview(id,uid){if(!$('editPreview'))return;const c=db.consumers.find(x=>x.id===id),r=uid?c.records.find(x=>x.uid===uid):null;if(!r)return;const cur=Number($('editCurrent').value)||0,units=Math.max(0,cur-Number(r.prevReading));$('editPreview').innerHTML=`<div class="preview"><div class="label">Live preview</div><strong>${money(calcBill(units,Number($('editYear').value),Number($('editMonth').value)))}</strong><div class="small muted">${units} units • Payment date: ${dateLabel(bsValue('editDate'))}</div></div>`}
function saveHistoryEdit(id,uid){const c=db.consumers.find(x=>x.id===id),r=c.records.find(x=>x.uid===uid);const y=Number($('editYear').value),m=Number($('editMonth').value),cur=Number($('editCurrent').value),paid=Number($('editPaid').value);if(!Number.isFinite(cur)||cur<Number(r.prevReading))return alert('Current reading cannot be lower than previous reading.');if(c.records.some(x=>x.uid!==uid&&x.year===y&&x.month===m))return alert('Another record already uses that month.');r.year=y;r.month=m;r.currentReading=cur;r.amountPaid=Math.max(0,paid);r.paymentMethod=$('editMethod').value;r.paymentDate=bsValue('editDate');normalizeRecords(c);showAdminHistory(id)}

function dueCardHTML(c,cur){
  const totalDue=c.records.reduce((t,r)=>t+(Number(r.remaining)||0),0);
  const curDue=cur?(Number(cur.remaining)||0):0, prevDue=Math.max(0,totalDue-curDue);
  const color=totalDue>0?'var(--red)':'var(--green)';
  return `<div class="card"><div class="row"><div><div class="label">Total due amount</div><div class="value" style="color:${color}">${money(totalDue)}</div></div><span class="pill ${totalDue>0?'due':'paid'}">${totalDue>0?'Payment due':'No dues'}</span></div>${totalDue>0?`<div class="small muted" style="margin-top:10px">${cur?esc(monthLabel(cur.year,cur.month))+' due: '+money(curDue)+' • ':''}Previous dues: ${money(prevDue)}</div>`:''}</div>`;
}
function renderConsumer(){const c=db.consumers.find(x=>x.id===session.id);normalizeRecords(c);const cur=current(c);const body=`<div class="card"><div class="row"><div><h2 class="title">${esc(c.id)} — ${esc(c.name)}</h2><p class="sub">Meter ${esc(c.meter)}</p></div><button class="btn secondary" onclick="logout()">Logout</button></div></div><div class="card"><div class="row"><div><div class="label">Current month bill</div><div class="value">${cur?money(cur.bill):'NPR 0'}</div></div><span class="pill ${cur?(cur.status==='Paid'?'paid':'due'):'none'}">${cur?cur.status:'No record'}</span></div></div>${dueCardHTML(c,cur)}<div class="grid"><div class="card"><div class="label">Current reading</div><div class="value">${cur?esc(cur.currentReading):'—'}</div></div><div class="card"><div class="label">Units used</div><div class="value">${cur?esc(cur.units):'—'}</div></div></div><div class="card"><div class="row"><h2 class="title">Previous 5 months</h2></div>${c.records.length?c.records.slice(0,5).map(r=>recordHTML(c,r,false)).join(''):`<div class="empty">No previous records yet.</div>`}</div><p class="muted right">Billing rate${cur?' ('+monthLabel(cur.year,cur.month)+')':''}: ${rateMoney(cur&&cur.rate!=null?cur.rate:db.rate)}/unit${(cur&&cur.rate!=null?cur.fixedCharge:db.fixed)?' • Fixed charge '+money(cur&&cur.rate!=null?cur.fixedCharge:db.fixed):''}</p>`;shell(body)}

kMedia=recheckMedia;window.updateMainCalc=updateMainCalc;window.editMonthRate=editMonthRate;window.removeMonthRate=removeMonthRate;window.updateMainPrev=updateMainPrev;window.bsDateControls=bsDateControls;window.refreshBSMonth=refreshBSMonth;window.refreshBSDays=refreshBSDays;window.bsValue=bsValue;window.showAddReading=showAddReading;window.refreshReadingMonth=refreshReadingMonth;window.updateReadingMonthLabel=updateReadingMonthLabel;window.saveReading=saveReading;window.editConsumer=editConsumer;window.saveConsumerEdit=saveConsumerEdit;
